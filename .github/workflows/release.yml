name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os: macos
          - platform: macos-latest
            target: x86_64-apple-darwin
            os: macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }

      - name: Install Linux deps
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev

      - run: pnpm install
      - run: pnpm tauri build --target ${{ matrix.target }}

      - name: Assert installer size <25MB
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" \) -exec sh -c '
            for f; do
              size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)
              size_mb=$((size / 1048576))
              if [ "$size_mb" -gt 25 ]; then
                echo "ERROR: $f is ${size_mb}MB (limit: 25MB)"
                exit 1
              fi
              echo "OK: $f is ${size_mb}MB"
            done
          ' sh {} +

      - uses: actions/upload-artifact@v4
        with:
          name: agentloft-${{ matrix.os }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/